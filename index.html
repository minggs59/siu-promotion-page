<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153e75">
  <meta name="description" content="시니어비즈니스학과 홍보단 SIU의 행사 및 홍보 안내 페이지입니다.">
  <title>SIU | 행사 및 홍보 안내</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">KANGNAM UNIVERSITY · SIU</p>
      <h1>SIU 행사 및 홍보 안내</h1>
      <p class="subtitle">시니어비즈니스학과 홍보단 SIU</p>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <p class="kicker">WELCOME</p>
      <h2>안녕하세요, SIU입니다.</h2>
      <p>행사 포스터와 관련 안내 자료를 이 페이지에서 확인하실 수 있습니다.</p>
    </section>

    <section aria-labelledby="posters-title" class="section">
      <div class="section-heading">
        <div>
          <p class="kicker">POSTERS</p>
          <h2 id="posters-title">포스터</h2>
        </div>
        <span class="section-note">최신 안내를 확인해 주세요.</span>
      </div>
      <div id="poster-list" class="poster-grid"></div>
    </section>

    <section aria-labelledby="resources-title" class="section">
      <div class="section-heading">
        <div>
          <p class="kicker">MORE INFORMATION</p>
          <h2 id="resources-title">추가 자료 및 링크</h2>
        </div>
      </div>
      <div id="resource-list" class="resource-list"></div>
    </section>

    <footer>
      <p>SIU · 시니어비즈니스학과 홍보단</p>
      <p class="footer-small">페이지의 정보는 필요에 따라 업데이트될 수 있습니다.</p>
    </footer>
  </main>
  <script src="content.js"></script>
</body>
</html>
